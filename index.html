<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <!-- 게임 이름은 적지 않는다 — 목록의 단일 진실원본은 src/data/games.ts 다. -->
    <meta name="description" content="khkim3115 가 만든 보드게임 웹 앱 모음. 설치 없이 브라우저에서 바로 플레이." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://khkim3115.github.io/" />
    <meta property="og:title" content="보드게임 모음" />
    <meta property="og:description" content="khkim3115 가 만든 보드게임 웹 앱 모음. 설치 없이 브라우저에서 바로 플레이." />
    <title>보드게임 모음</title>
    <script>
      // 페인트 전에 테마를 심어 깜빡임을 막는다. 규칙은 src/lib/theme.ts(resolveTheme·THEME_COLORS)와 같다.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('hub_theme');
        } catch (e) {
          // localStorage 사용 불가 — 시스템 설정을 따른다.
        }
        var prefersLight = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        var theme = stored === 'dark' || stored === 'light' ? stored : prefersLight ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'light' ? '#f5f6f8' : '#0d1117');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
